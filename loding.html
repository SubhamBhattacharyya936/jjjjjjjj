<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Carrom 3D...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Spinning carrom piece loader */
    .spinner {
      width: 120px;
      height: 120px;
      position: relative;
      margin-bottom: 40px;
    }

    .spinner .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid transparent;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .spinner .ring:nth-child(1) {
      border-top-color: #ffd700;
      animation-delay: 0s;
    }

    .spinner .ring:nth-child(2) {
      border-right-color: #ff9933;
      animation-delay: 0.15s;
    }

    .spinner .ring:nth-child(3) {
      border-bottom-color: #ffffff;
      animation-delay: 0.3s;
    }

    .spinner .ring:nth-child(4) {
      border-left-color: #cc0000;
      animation-delay: 0.45s;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Inner carrom piece */
    .spinner .center-piece {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffbe0, #e6c300);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.15);
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
      }
    }

    /* Title */
    .loader-title {
      font-size: 32px;
      font-weight: 800;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    }

    .loader-subtitle {
      font-size: 14px;
      color: #ccc;
      letter-spacing: 1px;
      margin-bottom: 30px;
      opacity: 0.8;
    }

    /* Progress bar */
    .progress-track {
      width: 260px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff9933, #ffd700);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      transition: width 0.1s linear;
    }

    /* Percentage text */
    .progress-text {
      font-size: 13px;
      color: #aaa;
      letter-spacing: 1px;
    }

    /* Loading dots */
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0% {
        content: '';
      }
      25% {
        content: '.';
      }
      50% {
        content: '..';
      }
      75% {
        content: '...';
      }
      100% {
        content: '';
      }
    }

    /* Board accent ring (decorative) */
    .board-accent {
      position: fixed;
      bottom: -80px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 3px solid rgba(255, 215, 0, 0.08);
      pointer-events: none;
    }

    .board-accent:nth-child(2) {
      bottom: -120px;
      width: 280px;
      height: 280px;
      border-color: rgba(255, 153, 51, 0.06);
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <!-- Spinner -->
    <div class="spinner">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="center-piece"></div>
    </div>

    <!-- Title -->
    <div class="loader-title">Carrom 3D</div>
    <div class="loader-subtitle">Player vs CPU</div>

    <!-- Progress bar -->
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text">
      <span id="progressText">0</span>% &nbsp;•&nbsp; Loading<span class="loading-dots"></span>
    </div>
  </div>

  <!-- Decorative accents -->
  <div class="board-accent"></div>
  <div class="board-accent"></div>

  <script>
    (function () {
      // ==================== CONFIG ====================
      const DURATION = 3000; // 3 seconds
      const REDIRECT_URL = 'https://dcacarrom.netlify.app';
      const START_TIME = performance.now();

      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');

      // ==================== ANIMATION LOOP ====================
      function updateProgress() {
        const elapsed = performance.now() - START_TIME;
        const ratio = Math.min(elapsed / DURATION, 1);
        const percent = Math.floor(ratio * 100);

        progressFill.style.width = percent + '%';
        progressText.textContent = percent;

        if (ratio < 1) {
          requestAnimationFrame(updateProgress);
        } else {
          // 100% reached — redirect
          progressFill.style.width = '100%';
          progressText.textContent = '100';

          // Small delay for visual satisfaction
          setTimeout(function () {
            // Use replace so the loading page doesn't stay in history
            window.location.replace(REDIRECT_URL);
          }, 200);
        }
      }

      // ==================== START ====================
      // Kick off the progress animation
      requestAnimationFrame(updateProgress);

      // Fallback: absolute guarantee redirect after DURATION + buffer
      // In case requestAnimationFrame is throttled (e.g., background tab)
      setTimeout(function () {
        window.location.replace(REDIRECT_URL);
      }, DURATION + 500);

    })();
  </script>
</body>
</html>
